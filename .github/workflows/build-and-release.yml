name: Build and Release Beta

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and install into Python virtualenv
        shell: bash
        run: |
          python -m venv src-python/.venv
          if [ -x src-python/.venv/bin/python ]; then
            VENV_PY=src-python/.venv/bin/python
          else
            VENV_PY=src-python/.venv/Scripts/python.exe
          fi
          $VENV_PY -m pip install --upgrade pip
          $VENV_PY -m pip install -r src-python/requirements.txt
          echo "VENV python: $VENV_PY"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Recreate src-python/.env from Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > src-python/.env
          echo "SUPABASE_KEY=$SUPABASE_KEY" >> src-python/.env
          echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> src-python/.env

      - name: Cache Nuitka Linux Binary
        id: cache-nuitka
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/python-sidecar
            src-tauri/python-sidecar-x86_64-unknown-linux-gnu
          key: ${{ runner.os }}-nuitka-${{ hashFiles('src-python/**/*.py', 'src-python/requirements.txt', 'scripts/build_py_sidecar.mjs') }}

      - name: Build Python Sidecar
        if: steps.cache-nuitka.outputs.cache-hit != 'true'
        env:
          SSC_MODE: beta
        run: npm run build:py

      - name: Verify Python Sidecar Integration
        run: python scripts/test_sidecar.py

      - name: Build Tauri App (.deb)
        env:
          SSC_MODE: beta
          VITE_APP_CHANNEL: beta
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssc-linux-beta
          path: src-tauri/target/release/bundle/deb/*.deb

  build-windows:
    name: Build Windows (.msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and install into Python virtualenv
        shell: bash
        run: |
          python -m venv src-python/.venv
          if [ -x src-python/.venv/bin/python ]; then
            VENV_PY=src-python/.venv/bin/python
          else
            VENV_PY=src-python/.venv/Scripts/python.exe
          fi
          $VENV_PY -m pip install --upgrade pip
          $VENV_PY -m pip install -r src-python/requirements.txt
          echo "VENV python: $VENV_PY"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Recreate src-python/.env from Secrets (Windows)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > src-python/.env
          echo "SUPABASE_KEY=$SUPABASE_KEY" >> src-python/.env
          echo "SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> src-python/.env

      - name: Cache Nuitka Windows Binary
        id: cache-nuitka
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/python-sidecar.exe
            src-tauri/python-sidecar-x86_64-pc-windows-msvc.exe
          key: ${{ runner.os }}-nuitka-${{ hashFiles('src-python/**/*.py', 'src-python/requirements.txt', 'scripts/build_py_sidecar.mjs') }}

      - name: Build Python Sidecar
        if: steps.cache-nuitka.outputs.cache-hit != 'true'
        env:
          SSC_MODE: beta
        run: npx cross-env SSC_MODE=beta npm run build:py

      - name: Verify Python Sidecar Integration
        run: python scripts/test_sidecar.py

      - name: Build Tauri App (.msi)
        env:
          SSC_MODE: beta
          VITE_APP_CHANNEL: beta
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx cross-env SSC_MODE=beta VITE_APP_CHANNEL=beta npm run tauri build

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssc-windows-beta
          path: src-tauri/target/release/bundle/msi/*.msi

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ssc-linux-beta
          path: ./dist-release

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ssc-windows-beta
          path: ./dist-release

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist-release/*.deb
            ./dist-release/*.msi
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
